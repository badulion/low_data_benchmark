model:
  _target_: src.model._point._grind.GrIND
  prediction_net:
    _target_: src.model._grid._neuralpde.NeuralPDE
    input_dim: ${InChannels}
    output_dim: ${OutChannels}
    hidden_channels: 256
    hidden_layers: 3
    solver: {'method': 'euler', 'options': {'step_size': 0.05}}
    use_adjoint: False
  num_ks: 9
  grid_resolution: 64
  spatial_dim: 2

structure: cloud
type: point
wrapper: ${point_wrapper}
name: grind